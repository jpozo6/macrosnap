name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Ejecutar tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

      - name: Ejecutar validadores de hooks
        run: |
          python3 .claude/hooks/validators/check_prompts.py
          python3 .claude/hooks/validators/check_macro_schema.py
          python3 .claude/hooks/validators/check_langgraph.py
          python3 .claude/hooks/validators/check_parse_tests.py
