name: Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Ejecutar tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

  build-web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias mobile
        run: cd mobile && npm install --legacy-peer-deps

      - name: Build web export
        run: cd mobile && npx expo export --platform web --output-dir ../web-dist

      - name: Subir artefacto web
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-dist/

  deploy:
    needs: [test, build-web]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Descargar artefacto web
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist/

      - name: Copiar web-dist al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "web-dist/*"
          target: "~/macrosnap/"
          overwrite: true

      - name: Desplegar en servidor Hetzner
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/macrosnap
            git pull origin main
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
            docker image prune -f
